<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="900" height="340" fill="#fbfbf9"/>

  <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">
    The Locked Archive — Easy Instance (3 rooms)
  </text>

  <!-- Rooms -->
  <g>
    <rect x="60" y="120" width="180" height="110" rx="14" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="150" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b6cb0">r1 (start)</text>
    <text x="150" y="180" text-anchor="middle" font-size="14" fill="#333">item: key1</text>
  </g>

  <g>
    <rect x="360" y="120" width="180" height="110" rx="14" fill="#fff7e6" stroke="#b7791f" stroke-width="2.5"/>
    <text x="450" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#b7791f">r2</text>
    <text x="450" y="180" text-anchor="middle" font-size="14" fill="#333">clue for l2</text>
  </g>

  <g>
    <rect x="660" y="120" width="180" height="110" rx="14" fill="#eafaf0" stroke="#2f855a" stroke-width="3"/>
    <text x="750" y="152" text-anchor="middle" font-size="20" font-weight="bold" fill="#2f855a">r3 (exit)</text>
    <text x="750" y="180" text-anchor="middle" font-size="14" fill="#333">goal</text>
  </g>

  <!-- Edges -->
  <line x1="240" y1="175" x2="356" y2="175" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="255" y="150" width="90" height="24" rx="6" fill="#2b6cb0"/>
  <text x="300" y="167" text-anchor="middle" font-size="13" fill="white" font-weight="bold">l1 (key)</text>

  <line x1="540" y1="175" x2="656" y2="175" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="555" y="150" width="90" height="24" rx="6" fill="#b7791f"/>
  <text x="600" y="167" text-anchor="middle" font-size="13" fill="white" font-weight="bold">l2 (code)</text>

  <!-- Legend -->
  <g transform="translate(60,270)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#2b6cb0"/>
    <text x="26" y="14" font-size="13" fill="#333">key lock</text>
    <rect x="140" y="0" width="18" height="18" rx="4" fill="#b7791f"/>
    <text x="166" y="14" font-size="13" fill="#333">code lock</text>
    <rect x="290" y="0" width="18" height="18" rx="4" fill="#2f855a"/>
    <text x="316" y="14" font-size="13" fill="#333">exit room</text>
  </g>
</svg>

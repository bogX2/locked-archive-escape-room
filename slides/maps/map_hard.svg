<svg viewBox="0 0 1300 500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1300" height="500" fill="#fbfbf9"/>

  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">
    The Locked Archive — Hard Instance (8 rooms, two branches)
  </text>

  <!-- ============ ROOMS ============ -->
  <!-- r1 -->
  <rect x="40" y="150" width="160" height="100" rx="14" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="120" y="182" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b6cb0">r1 (start)</text>
  <text x="120" y="205" text-anchor="middle" font-size="12" fill="#333">item: key_start</text>

  <!-- r2 hub -->
  <rect x="260" y="150" width="160" height="100" rx="14" fill="#f3eaff" stroke="#553c9a" stroke-width="2.5"/>
  <text x="340" y="182" text-anchor="middle" font-size="18" font-weight="bold" fill="#553c9a">r2 (hub)</text>
  <text x="340" y="205" text-anchor="middle" font-size="12" fill="#333">key_w1, key_e1</text>

  <!-- WEST branch: r3 r4 r5 (top row) -->
  <rect x="480" y="30" width="150" height="90" rx="14" fill="#eafaf0" stroke="#2f855a" stroke-width="2.5"/>
  <text x="555" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f855a">r3</text>
  <text x="555" y="78" text-anchor="middle" font-size="11" fill="#333">item_p, clue l_w2</text>

  <rect x="670" y="30" width="150" height="90" rx="14" fill="#eafaf0" stroke="#2f855a" stroke-width="2.5"/>
  <text x="745" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f855a">r4</text>
  <text x="745" y="78" text-anchor="middle" font-size="11" fill="#333">item_q</text>

  <rect x="860" y="30" width="150" height="90" rx="14" fill="#eafaf0" stroke="#2f855a" stroke-width="2.5"/>
  <text x="935" y="58" text-anchor="middle" font-size="17" font-weight="bold" fill="#2f855a">r5</text>
  <text x="935" y="78" text-anchor="middle" font-size="11" fill="#333">clue l_w4</text>

  <!-- EAST branch: r6 r7 (bottom row) -->
  <rect x="480" y="330" width="150" height="90" rx="14" fill="#fff5f5" stroke="#c53030" stroke-width="2.5"/>
  <text x="555" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">r6</text>
  <text x="555" y="378" text-anchor="middle" font-size="11" fill="#333">item_m, clue l_e2</text>

  <rect x="670" y="330" width="150" height="90" rx="14" fill="#fff5f5" stroke="#c53030" stroke-width="2.5"/>
  <text x="745" y="358" text-anchor="middle" font-size="17" font-weight="bold" fill="#c53030">r7</text>
  <text x="745" y="378" text-anchor="middle" font-size="11" fill="#333">item_n, key_e3</text>

  <!-- exit r8 -->
  <rect x="1080" y="150" width="180" height="100" rx="14" fill="#fffbea" stroke="#b7791f" stroke-width="3"/>
  <text x="1170" y="182" text-anchor="middle" font-size="19" font-weight="bold" fill="#b7791f">r8 (exit)</text>
  <text x="1170" y="205" text-anchor="middle" font-size="12" fill="#333">goal</text>

  <!-- ============ EDGES ============ -->
  <!-- r1 -> r2 : l0 key, cost 1 -->
  <line x1="200" y1="200" x2="256" y2="200" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="228" y="192" text-anchor="middle" font-size="11" fill="#2b6cb0" font-weight="bold">l0 (1)</text>

  <!-- r2 -> r3 : l_w1 key, cost 3 -->
  <line x1="392" y1="152" x2="500" y2="118" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="430" y="120" text-anchor="middle" font-size="11" fill="#2f855a" font-weight="bold">l_w1 (3)</text>

  <!-- r3 -> r4 : l_w2 code, cost 3 -->
  <line x1="630" y1="75" x2="666" y2="75" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="648" y="65" text-anchor="middle" font-size="11" fill="#2f855a" font-weight="bold">l_w2 (3)</text>

  <!-- r4 -> r5 : l_w3 key (combine), cost 3 -->
  <line x1="820" y1="75" x2="856" y2="75" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="838" y="65" text-anchor="middle" font-size="11" fill="#2f855a" font-weight="bold">l_w3* (3)</text>

  <!-- r5 -> r8 : l_w4 code, cost 3 -->
  <line x1="1010" y1="105" x2="1090" y2="160" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1075" y="120" text-anchor="middle" font-size="11" fill="#2f855a" font-weight="bold">l_w4 (3)</text>

  <!-- r2 -> r6 : l_e1 key, cost 5 -->
  <line x1="392" y1="248" x2="500" y2="336" stroke="#c53030" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="430" y="300" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold">l_e1 (5)</text>

  <!-- r6 -> r7 : l_e2 code, cost 5 -->
  <line x1="630" y1="375" x2="666" y2="375" stroke="#c53030" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="648" y="395" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold">l_e2 (5)</text>

  <!-- r7 -> r8 : l_e3 key, cost 5 -->
  <line x1="820" y1="336" x2="1090" y2="240" stroke="#c53030" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="985" y="310" text-anchor="middle" font-size="11" fill="#c53030" font-weight="bold">l_e3 (5)</text>

  <!-- ============ CALLOUTS ============ -->
  <g>
    <rect x="480" y="140" width="330" height="26" rx="6" fill="#eafaf0" stroke="#2f855a"/>
    <text x="645" y="158" text-anchor="middle" font-size="12" fill="#22543d" font-weight="bold">
      WEST branch — cost 1+3+3+3+3 = 13 (optimal)
    </text>
  </g>
  <g>
    <rect x="480" y="440" width="340" height="26" rx="6" fill="#fff5f5" stroke="#c53030"/>
    <text x="650" y="458" text-anchor="middle" font-size="12" fill="#742a2a" font-weight="bold">
      EAST branch — cost 1+5+5+5 = 16 (sub-optimal)
    </text>
  </g>

  <g>
    <rect x="30" y="440" width="410" height="46" rx="8" fill="#fdf2f8" stroke="#b83280" stroke-width="1.5"/>
    <text x="235" y="458" text-anchor="middle" font-size="11.5" fill="#702459" font-weight="bold">
      * l_w3 needs key_w3 = combine(item_p, item_q) — MANDATORY
    </text>
    <text x="235" y="475" text-anchor="middle" font-size="11.5" fill="#702459">
      combine(item_m, item_n) → bonus_item on east branch is a DECOY (unused)
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(30,20)">
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#2b6cb0"/>
    <text x="22" y="13" font-size="11" fill="#333">entry</text>
    <rect x="80" y="0" width="16" height="16" rx="4" fill="#553c9a"/>
    <text x="102" y="13" font-size="11" fill="#333">hub</text>
    <rect x="150" y="0" width="16" height="16" rx="4" fill="#2f855a"/>
    <text x="172" y="13" font-size="11" fill="#333">west (cheap)</text>
    <rect x="270" y="0" width="16" height="16" rx="4" fill="#c53030"/>
    <text x="292" y="13" font-size="11" fill="#333">east (expensive)</text>
    <rect x="400" y="0" width="16" height="16" rx="4" fill="#b7791f"/>
    <text x="422" y="13" font-size="11" fill="#333">exit</text>
  </g>
</svg>

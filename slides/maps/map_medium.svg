<svg viewBox="0 0 1250 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="1250" height="420" fill="#fbfbf9"/>

  <text x="625" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">
    The Locked Archive — Medium Instance (5 rooms, 1 mandatory combine)
  </text>

  <!-- Rooms -->
  <g>
    <rect x="30" y="150" width="180" height="120" rx="14" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="120" y="182" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6cb0">r1 (start)</text>
    <text x="120" y="208" text-anchor="middle" font-size="13" fill="#333">item: key_a</text>
    <text x="120" y="228" text-anchor="middle" font-size="13" fill="#333">clue for l2</text>
  </g>

  <g>
    <rect x="270" y="150" width="180" height="120" rx="14" fill="#fff7e6" stroke="#b7791f" stroke-width="2.5"/>
    <text x="360" y="182" text-anchor="middle" font-size="19" font-weight="bold" fill="#b7791f">r2</text>
    <text x="360" y="208" text-anchor="middle" font-size="13" fill="#333">item: item_x</text>
  </g>

  <g>
    <rect x="510" y="150" width="180" height="120" rx="14" fill="#eaf3ff" stroke="#2b6cb0" stroke-width="2.5"/>
    <text x="600" y="182" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b6cb0">r3</text>
    <text x="600" y="208" text-anchor="middle" font-size="13" fill="#333">item: item_y</text>
  </g>

  <g>
    <rect x="750" y="150" width="180" height="120" rx="14" fill="#fff7e6" stroke="#b7791f" stroke-width="2.5"/>
    <text x="840" y="182" text-anchor="middle" font-size="19" font-weight="bold" fill="#b7791f">r4</text>
    <text x="840" y="208" text-anchor="middle" font-size="13" fill="#333">clue for l4</text>
  </g>

  <g>
    <rect x="1000" y="150" width="200" height="120" rx="14" fill="#eafaf0" stroke="#2f855a" stroke-width="3"/>
    <text x="1100" y="182" text-anchor="middle" font-size="19" font-weight="bold" fill="#2f855a">r5 (exit)</text>
    <text x="1100" y="208" text-anchor="middle" font-size="13" fill="#333">goal</text>
  </g>

  <!-- Edges -->
  <line x1="210" y1="210" x2="266" y2="210" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="182" y="228" width="112" height="24" rx="6" fill="#2b6cb0"/>
  <text x="238" y="245" text-anchor="middle" font-size="13" fill="white" font-weight="bold">l1 key_a</text>

  <line x1="450" y1="210" x2="506" y2="210" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="425" y="228" width="105" height="24" rx="6" fill="#b7791f"/>
  <text x="478" y="245" text-anchor="middle" font-size="13" fill="white" font-weight="bold">l2 (code)</text>

  <line x1="690" y1="210" x2="746" y2="210" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="655" y="228" width="130" height="24" rx="6" fill="#2b6cb0"/>
  <text x="720" y="245" text-anchor="middle" font-size="13" fill="white" font-weight="bold">l3 key_c*</text>

  <line x1="930" y1="210" x2="996" y2="210" stroke="#555" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="900" y="228" width="105" height="24" rx="6" fill="#b7791f"/>
  <text x="953" y="245" text-anchor="middle" font-size="13" fill="white" font-weight="bold">l4 (code)</text>

  <!-- combine callout -->
  <g>
    <rect x="380" y="330" width="490" height="60" rx="10" fill="#fdf2f8" stroke="#b83280" stroke-width="2"/>
    <text x="625" y="358" text-anchor="middle" font-size="14" fill="#702459" font-weight="bold">
      combine(item_x, item_y) → key_c
    </text>
    <text x="625" y="378" text-anchor="middle" font-size="12" fill="#702459">
      MANDATORY: key_c cannot be found anywhere — it must be produced to open l3 (l3 = *)
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(30,300)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#2b6cb0"/>
    <text x="26" y="14" font-size="13" fill="#333">key lock</text>
    <rect x="140" y="0" width="18" height="18" rx="4" fill="#b7791f"/>
    <text x="166" y="14" font-size="13" fill="#333">code lock</text>
    <rect x="290" y="0" width="18" height="18" rx="4" fill="#2f855a"/>
    <text x="316" y="14" font-size="13" fill="#333">exit room</text>
  </g>
</svg>
